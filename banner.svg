<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Orleans Owen Syah</title>
  <desc id="desc">Biomedical instrumentation, embedded systems, and IoT telemetry. A dark technical banner with a cyan waveform and amber circuit traces.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#203044" stroke-width="1"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#13253a"/></linearGradient>
  </defs>
  <style>
    .signal { stroke-dasharray: 42 330; animation: flow 4s linear infinite; }
    .chip { animation: pulse 4s ease-in-out infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: beacon 4s ease-in-out infinite; }
    @keyframes flow { from { stroke-dashoffset: 372; } to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes beacon { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
    @media (prefers-reduced-motion: reduce) { .signal,.chip,.node { animation: none; } }
  </style>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect x="800" width="480" height="320" fill="url(#grid)" opacity=".55"/>
  <path d="M48 48h44" stroke="#5eead4" stroke-width="4"/>
  <text x="48" y="86" fill="#5eead4" font-family="monospace" font-size="14" letter-spacing="3">ENGINEERING PORTFOLIO</text>
  <text x="44" y="154" fill="#f1f5f9" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="700">Orleans Owen Syah</text>
  <text x="48" y="201" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="21">Biomedical instrumentation. Embedded systems. IoT telemetry.</text>
  <text x="48" y="269" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="1">ITS / ELECTRICAL &amp; PROGRAMMING / @owengg22</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M865 155h35l14-22 20 55 22-104 22 137 22-66h34" stroke="#5eead4" stroke-width="3" opacity=".35"/>
    <path class="signal" d="M865 155h35l14-22 20 55 22-104 22 137 22-66h34" stroke="#5eead4" stroke-width="3"/>
    <rect x="1064" y="110" width="104" height="104" rx="12" stroke="#94a3b8" stroke-width="2"/>
    <rect class="chip" x="1084" y="130" width="64" height="64" rx="5" stroke="#fbbf24" stroke-width="2"/>
    <path d="M1034 155h30m104-17h42v-54m-42 101h62v55M1090 110V79m26 31V63m26 47V79m-52 135v31m26-31v47m26-47v31" stroke="#64748b" stroke-width="2"/>
    <circle class="node" cx="1210" cy="79" r="5" stroke="#fbbf24" stroke-width="2"/>
    <circle class="node" cx="1230" cy="245" r="5" stroke="#5eead4" stroke-width="2"/>
  </g>
</svg>
